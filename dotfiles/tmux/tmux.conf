# some set options
set -g default-command "${SHELL}"
set -g prefix c-f
set -sg escape-time 1 # delay before sending commands
set -g base-index 1 # start index at 1 instead of 0
setw -g pane-base-index 1 # pane index start at 1
set-option -g status-position top # status bar is going top
set -g mouse on
setw -g allow-rename off

# ── Status bar styling (Catppuccin Mocha + dark green) ──
set -g status-style "bg=#0a1f0a,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[fg=#0a1f0a,bg=#cba6f7,bold]  #S #[fg=#cba6f7,bg=#0a1f0a] "

# inactive windows
set-window-option -g window-status-format "#[fg=#6c7086,bg=#0a1f0a]  #I #W "

# active window (powerline pill)
set-window-option -g window-status-current-format "#[fg=#45475a,bg=#0a1f0a]#[fg=#cba6f7,bg=#45475a,bold]  #I #W #[fg=#45475a,bg=#0a1f0a]"

set-option -g window-status-separator ""

# message and mode styling
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"
set -g mode-style "bg=#45475a,fg=#cdd6f4"

setw -g mode-keys vi

# ACTIVE PANE HIGHLIGHTING (maintaining transparency)
# Bright colored border for active pane, subtle for inactive
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"

set -g pane-active-border-style "fg=#cba6f7,bg=default"
set -g pane-border-style "fg=#313244,bg=default"

# unbinds
unbind c-b
unbind r
unbind n
unbind c
unbind [
unbind p
unbind up
unbind down

# binds
bind p paste-buffer # paste
bind c-f send-prefix # new leaderkey
bind | split-window -h -c "#{pane_current_path}" # split window
bind - split-window -v -c "#{pane_current_path}" # split window
bind n new-window -c "#{pane_current_path}" # create a new window
bind -r h if -F '#{pane_at_left}' '' 'select-pane -L' # select another pane
bind -r j if -F '#{pane_at_bottom}' '' 'select-pane -D' # select another pane
bind -r k if -F '#{pane_at_top}' '' 'select-pane -U' # select another pane
bind -r l if -F '#{pane_at_right}' '' 'select-pane -R' # select another pane
bind -r '(' switch-client -p # select prev window
bind -r ')' switch-client -n # select next window
bind -r c-h select-window -t :- # select next window
bind -r c-l select-window -t :+ # select next window
# resizing panes
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
bind escape copy-mode # press escape if we want to move through terminal
bind -T copy-mode-vi y send -X copy-selection # copy
bind -T copy-mode-vi v send -X begin-selection # 'visual mode'
bind -T copy-mode-vi Escape send -X cancel # ESC exits visual mode
bind c-r source-file ~/.tmux.conf \; display "reloaded!" # reload current config
bind down last-window \; swap-pane -s tmp.1 \; kill-window -t tmp
bind up new-window -d -n tmp \; swap-pane -s tmp.1 \; select-window -t tmp

# restorring is prefix + r
set -g @resurrect-restore 'r'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g status-right ""

run '~/.tmux/plugins/tpm/tpm'
